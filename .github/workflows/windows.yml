# Compila Discalaves en Windows, corre las pruebas que no necesitan GPU, Docker ni WSL (rutas y
# adaptadores) y deja el instalador como artefacto descargable.
# Los runners de GitHub no tienen GPU ni WSL2: aquí NO se prueba el modelo ni las computadoras de los
# empleados. Eso se prueba a mano con PRUEBAS_WINDOWS.md.
name: Windows

on:
  push:
  workflow_dispatch:

jobs:
  instalador:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Compilar
        run: npx tsc -p .
      - name: Pruebas de unidad (rutas y adaptadores)
        run: node dist/prueba-unidad.js
      - name: Instalador (NSIS, x64)
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: discalaves-instalador-windows
          path: app/instalador/*.exe
          if-no-files-found: error
