<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; frame-src http://127.0.0.1:*">
  <title>Discalaves</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Vidrio líquido: el mapa desplaza el fondo solo cerca de los bordes (centro gris neutro = sin desplazamiento). -->
  <svg class="oculto" aria-hidden="true">
    <filter id="vidrio" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage preserveAspectRatio="none" result="mapa"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><defs><linearGradient id='x'><stop offset='0' stop-color='rgb(255,0,0)'/><stop offset='1' stop-color='rgb(0,0,0)'/></linearGradient><linearGradient id='y' x2='0' y2='1'><stop offset='0' stop-color='rgb(0,255,0)'/><stop offset='1' stop-color='rgb(0,0,0)'/></linearGradient><filter id='b'><feGaussianBlur stdDeviation='4'/></filter></defs><rect width='100' height='100' fill='url(%23x)'/><rect width='100' height='100' fill='url(%23y)' style='mix-blend-mode:screen'/><rect x='10' y='10' width='80' height='80' rx='10' fill='rgb(128,128,128)' filter='url(%23b)'/></svg>"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="suave"/>
      <feDisplacementMap in="suave" in2="mapa" scale="70" xChannelSelector="R" yChannelSelector="G" result="refractado"/>
      <feColorMatrix in="refractado" type="saturate" values="1.6"/>
    </filter>
  </svg>

  <div class="fondo" aria-hidden="true">
    <span class="mancha m1"></span><span class="mancha m2"></span><span class="mancha m3"></span><span class="mancha m4"></span>
  </div>

  <div class="app">
    <aside class="lateral vidrio">
      <div class="lateral-arriba">
        <button id="nueva" class="icono" type="button" aria-label="Nueva conversación" title="Nueva conversación con una IA" popovertarget="menu-ia">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div id="menu-ia" class="menu-ia" popover aria-label="Elegir IA"></div>
      </div>
      <label class="buscador">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
        <input type="search" placeholder="buscar" aria-label="Buscar conversaciones">
      </label>
      <nav id="lista" class="lista" aria-label="Conversaciones"></nav>
      <button id="usuario" class="usuario" type="button" title="Editar perfil">
        <span id="usuario-iniciales" class="iniciales" aria-hidden="true"></span>
        <span id="usuario-nombre" class="nombre"></span>
      </button>
    </aside>

    <main class="panel">
      <header class="cabecera vidrio">
        <span id="cab-avatar"></span>
        <div class="cab-titulo">
          <h1 id="cab-nombre" class="nombre"></h1>
          <span id="cab-estado" class="cab-estado" role="status"></span>
        </div>
        <button id="modo-libre" class="modo-libre" type="button" aria-pressed="false">modo libre</button>
        <button id="ver-pantalla" class="icono" type="button" aria-label="Ver su pantalla" aria-pressed="false" title="Ver su pantalla en vivo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        </button>
      </header>

      <section id="pantalla" class="pantalla vidrio" aria-label="Pantalla de qwen" hidden>
        <div class="pantalla-barra">
          <span id="pantalla-url" class="pantalla-url"></span>
          <button id="tomar-control" type="button" class="boton secundario" aria-pressed="false">tomar el control</button>
        </div>
        <iframe id="pantalla-vnc" title="Escritorio de qwen en vivo" src="about:blank"></iframe>
      </section>

      <section id="hilo" class="hilo" aria-label="Mensajes"></section>

      <form id="redactor" class="redactor vidrio">
        <button class="icono" type="button" aria-label="Adjuntar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input id="entrada" type="text" aria-label="Mensaje" autocomplete="off" placeholder=" ">
        <button id="enviar" class="microfono" type="submit" aria-label="Enviar mensaje">
          <svg class="icono-micro" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <svg class="icono-enviar" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
        <button id="detener" class="microfono detener" type="button" aria-label="Detener la tarea" title="Detener" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </form>
    </main>
  </div>

  <dialog id="perfil" class="perfil" aria-labelledby="perfil-titulo">
    <form method="dialog">
      <h2 id="perfil-titulo">Tu perfil</h2>
      <div id="encuadre" class="encuadre" tabindex="0" role="img" aria-label="Foto de perfil. Arrastra o usa las flechas para encuadrarla.">
        <img id="encuadre-img" alt="" draggable="false" hidden>
        <span id="encuadre-iniciales" class="iniciales"></span>
      </div>
      <label class="zoom">Zoom <input id="zoom" type="range" min="1" max="4" step="0.01" value="1" disabled></label>
      <div class="acciones">
        <button id="elegir-foto" type="button" class="boton secundario">Subir foto…</button>
        <button id="quitar-foto" type="button" class="boton secundario">Quitar foto</button>
        <input id="foto" type="file" accept="image/*" hidden>
      </div>
      <label class="campo">Nombre
        <input id="perfil-nombre" type="text" maxlength="40" required pattern=".*\S.*" autocomplete="off">
      </label>
      <div class="acciones">
        <button value="cancelar" formnovalidate class="boton secundario">Cancelar</button>
        <button value="guardar" class="boton">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="dist/interfaz.js"></script>
  <script src="dist/perfil.js"></script>
</body>
</html>
